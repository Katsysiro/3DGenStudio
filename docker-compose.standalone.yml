# 3D Gen Studio as ONE self-contained web app, talking to a ComfyUI that runs in
# another container (or anywhere reachable over HTTP).
#
# This is NOT the same as docker-compose.yml: that one is the shared multi-user
# data server, which deliberately has no ComfyUI, no setup wizard and no
# Settings (those routes answer 404 there, which is why the wizard cannot get
# past its first step). This one runs the app in local mode -- everything a
# desktop install does -- plus its four Python services as sibling containers.
#
#   1. cp .env.standalone.example .env.standalone   (then edit it)
#   2. docker compose -f docker-compose.standalone.yml --env-file .env.standalone up -d --build
#   3. open http://<server>:3001
#
# That starts the app and the mesh-tools service (CPU). The three GPU services
# are opt-in through profiles, one each or all together:
#   ... --profile rig      Auto Rig (SkinTokens)
#   ... --profile kimodo   text-to-motion (Kimodo)
#   ... --profile mocap    video-to-motion (MoCapAnything)
#   ... --profile gpu      all three
#   ... --profile mesh2motion   Mesh2Motion web app (rigging/animation in the browser)
# e.g. docker compose -f docker-compose.standalone.yml --env-file .env.standalone --profile rig up -d --build
#
# Full walkthrough: docs/DOCKER_STANDALONE.md
services:
  genstudio:
    build:
      context: .
      target: standalone
    image: 3dgenstudio-standalone:latest
    restart: unless-stopped
    # root by default: the setup wizard writes model files into the ComfyUI
    # folder mounted below, and that folder belongs to whatever user the ComfyUI
    # container runs as. Set GENSTUDIO_UID=1000:1000 (etc.) to match it instead.
    user: "${GENSTUDIO_UID:-0:0}"
    ports:
      - "${GENSTUDIO_PORT:-3001}:3001"
    environment:
      GENSTUDIO_MODE: local

      # Where ComfyUI answers, as seen FROM THIS CONTAINER. Applied to Settings on
      # every start (leave a variable empty to manage that field in the UI).
      #   - ComfyUI publishes 8188 on the host        -> http://host.docker.internal
      #   - both containers share a docker network    -> http://<comfyui service name>
      GENSTUDIO_COMFYUI_URL: ${GENSTUDIO_COMFYUI_URL:-http://host.docker.internal}
      GENSTUDIO_COMFYUI_PORT: ${GENSTUDIO_COMFYUI_PORT:-8188}

      # Where the ComfyUI folder is mounted INSIDE this container (see volumes).
      # The setup wizard is pre-filled with it and downloads models into
      # <path>/models/..., which ComfyUI then sees in its own container.
      GENSTUDIO_COMFYUI_PATH: ${GENSTUDIO_COMFYUI_PATH:-/comfyui}
      # Only if the models live outside <path>/models (mount them separately).
      GENSTUDIO_COMFYUI_MODELS_PATH: ${GENSTUDIO_COMFYUI_MODELS_PATH:-}

      # The Python services below, by compose service name. A service whose
      # profile is not started just reads as offline in the app.
      GENSTUDIO_MESHTOOLS_URL: http://meshtools
      GENSTUDIO_MESHTOOLS_PORT: "8200"
      GENSTUDIO_RIGTOOLS_URL: http://rigtools
      GENSTUDIO_RIGTOOLS_PORT: "8300"
      GENSTUDIO_MOTIONTOOLS_URL: http://motiontools
      GENSTUDIO_MOTIONTOOLS_PORT: "8400"
      GENSTUDIO_MOCAPTOOLS_URL: http://mocaptools
      GENSTUDIO_MOCAPTOOLS_PORT: "8401"

      # login:password. Strongly recommended if the port is reachable by anyone
      # but you: local mode has no user accounts and exposes Settings (API keys).
      GENSTUDIO_BASIC_AUTH: ${GENSTUDIO_BASIC_AUTH:-}

      # Behind a reverse proxy, the public address asset URLs should use.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too.
      - "host.docker.internal:host-gateway"
    volumes:
      # Projects, assets and the SQLite database. Must be /app/data.
      - genstudio-standalone-data:/app/data
      # The ComfyUI folder (the one that contains models/), shared with the
      # ComfyUI container. A host path, e.g. /opt/comfyui.
      - ${COMFYUI_DIR:?set COMFYUI_DIR in .env.standalone to the ComfyUI folder on the host}:/comfyui
    # To reach ComfyUI by its container name instead of through the host, put
    # both on the same network: uncomment this and the `networks:` block at the
    # bottom, and set GENSTUDIO_COMFYUI_URL=http://<comfyui container name>.
    # Keep `default` in the list -- it is how the app reaches the Python services.
    # networks:
    #   - default
    #   - comfy

  # --- Python services -------------------------------------------------------
  # Reached only by the app over the compose network, so no ports are published.
  # Weights download into each service's /data volume on first start (watch
  # `docker compose ... logs -f <service>`), never into the image.

  # Auto UV / Retopo, bake, LODs, collisions, segmentation, tree generator, FBX
  # export, mesh thumbnails. CPU only -- no GPU needed.
  meshtools:
    build:
      context: ./python-server
      args:
        MESHTOOLS_GPU: ${MESHTOOLS_GPU:-0}
    image: 3dgenstudio-meshtools:latest
    restart: unless-stopped

  # Auto Rig. GPU; ~14 GB of VRAM at peak upstream.
  rigtools:
    profiles: ["rig", "gpu"]
    build:
      context: ./thirdparty/skintokens
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu126}
    image: 3dgenstudio-rigtools:latest
    restart: unless-stopped
    volumes:
      - genstudio-rigtools-data:/data
    deploy: &gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Text to motion. GPU for the motion model; the ~16 GB text encoder runs on
  # the CPU (TEXT_ENCODER_DEVICE) and needs about that much free RAM.
  motiontools:
    profiles: ["kimodo", "gpu"]
    build:
      context: ./thirdparty/kimodo
      additional_contexts:
        wheels: ./resources/wheels/motion_correction
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu126}
    image: 3dgenstudio-motiontools:latest
    restart: unless-stopped
    environment:
      TEXT_ENCODER_DEVICE: ${KIMODO_TEXT_ENCODER_DEVICE:-cpu}
      KIMODO_SKIP_ENCODER: ${KIMODO_SKIP_ENCODER:-}
    volumes:
      - genstudio-motiontools-data:/data
    deploy: *gpu

  # Video to motion. GPU; up to ~10 GB of VRAM during a capture.
  mocaptools:
    profiles: ["mocap", "gpu"]
    build:
      context: ./thirdparty/mocapanything
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu126}
    image: 3dgenstudio-mocaptools:latest
    restart: unless-stopped
    volumes:
      - genstudio-mocaptools-data:/data
    deploy: *gpu

  # Mesh2Motion: a separate browser app (no GPU, no data of its own -- files
  # stay in the browser). Open http://<server>:${MESH2MOTION_PORT:-3002}.
  mesh2motion:
    profiles: ["mesh2motion"]
    build:
      context: ./docker/mesh2motion
    image: 3dgenstudio-mesh2motion:latest
    restart: unless-stopped
    ports:
      - "${MESH2MOTION_PORT:-3002}:80"

volumes:
  genstudio-standalone-data:
  genstudio-rigtools-data:
  genstudio-motiontools-data:
  genstudio-mocaptools-data:

